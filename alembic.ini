[alembic]
# путь к папке с миграциями
script_location = migrations

# чтобы Python видел пакет app при запуске alembic из корня проекта
prepend_sys_path = .

# шаблон имени файла миграции
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# таймзона для меток времени в имени файла (необязательно)
# timezone = Europe/Moscow

version_path_separator = os

# URL базы данных. В нашем случае он же продублирован в migrations/env.py,
# но alembic.ini - стандартное место для него при простом SQLite-проекте.
sqlalchemy.url = sqlite:///cosmetics_shop.db


[post_write_hooks]
# хуки форматирования сгенерированных файлов миграций (не используются)


# ---------------------- логирование ----------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
